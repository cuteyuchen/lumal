name: Release Gate

# 唯一发布入口。手动运行默认为无副作用演练，真实发布必须选择版本 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only validate; never publish or deploy
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  # 所有生产发布串行，防止不同 tag 并发修改 npm dist-tag 或生产站点。
  group: lumal-release
  cancel-in-progress: false

env:
  CI: true

jobs:
  version-check:
    name: Version / lockfile / workflow safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - run: pnpm release:workflows
      - name: Require a tag for side effects
        if: github.event_name == 'push' || !inputs.dry_run
        run: pnpm release:verify --require-tag
      - name: Validate Actions syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  release-check:
    name: Ubuntu release check
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release checks
        run: pnpm release:check

      - name: Upload validated npm distributions
        uses: actions/upload-artifact@v4
        with:
          name: lumal-npm-dist-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/icons/dist
            packages/icons-vue/dist
            packages/core/dist
            packages/charts/dist
            packages/viewport/dist
            packages/datav/dist
            packages/cockpit/dist
            packages/vben-compat/dist
            packages/vite/dist
            packages/create-lumal-admin/dist

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-ubuntu
          path: |
            .playwright-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-consumer-evidence-${{ github.sha }}
          path: |
            output/release/
            output/playwright/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated application distributions
        uses: actions/upload-artifact@v4
        with:
          name: lumal-validated-apps-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/lumal-admin/dist
            apps/vben-compat-demo/dist

  windows-check:
    name: Windows checks
    needs: version-check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Template formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Upload Windows terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-terminal-windows-${{ github.sha }}
          path: output/release/cli-terminal/
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Typecheck visual fixtures
        run: pnpm exec vue-tsc --noEmit -p packages/datav/tests/visual/tsconfig.json

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Repeat DataV visual regressions
        run: pnpm test:datav:visual --repeat-each=3

      - name: Upload Windows visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: datav-visual-windows-release-${{ github.sha }}
          path: .playwright-results/datav/
          if-no-files-found: ignore
          retention-days: 7

  site-build:
    name: Static site builds
    needs: [version-check, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm docs:build

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: lumal-npm-dist-${{ github.sha }}
          path: packages

      - name: Download applications validated by release check
        uses: actions/download-artifact@v4
        with:
          name: lumal-validated-apps-${{ github.sha }}
          path: apps

      - name: Build Cockpit through package script
        run: pnpm --filter lumal-cockpit build:app

      - name: Install Chromium for Cockpit
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Cockpit production browser
        run: pnpm test:e2e:cockpit:built

      - name: Build DataV guide through package script
        run: pnpm --filter lumal-datav-guide build:app

      - name: Check all consumer budgets
        run: pnpm release:budgets --require-all

      - name: Upload Cockpit browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-browser-${{ github.sha }}
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validated static sites
        uses: actions/upload-artifact@v4
        with:
          name: lumal-static-sites-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/lumal-docs/dist
            apps/lumal-admin/dist
            apps/lumal-cockpit/dist
            apps/lumal-datav-guide/dist
            apps/vben-compat-demo/dist

  publish:
    name: Gated npm publication
    needs: [version-check, release-check, windows-check, site-build]
    if: github.event_name == 'push' || !inputs.dry_run
    uses: ./.github/workflows/release-npm.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    name: Gated production deployment
    needs: [version-check, release-check, windows-check, site-build, publish]
    # 发包授权不等于部署授权；未显式启用时只发布 npm。
    if: (github.event_name == 'push' || !inputs.dry_run) && vars.DEPLOY_PRODUCTION == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      VERCEL_PROJECT_ID_COCKPIT: ${{ secrets.VERCEL_PROJECT_ID_COCKPIT }}
      VERCEL_PROJECT_ID_DATAV_GUIDE: ${{ secrets.VERCEL_PROJECT_ID_DATAV_GUIDE }}
      VERCEL_PROJECT_ID_VBEN_COMPAT: ${{ secrets.VERCEL_PROJECT_ID_VBEN_COMPAT }}
      VERCEL_PROJECT_ID_DOCS: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
