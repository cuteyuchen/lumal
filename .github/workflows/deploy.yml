name: Deploy

# 仅在完整门禁及 npm 发布成功后复用；平台 Git 自动部署必须另行关闭。
on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID_ADMIN:
        required: false
      VERCEL_PROJECT_ID_COCKPIT:
        required: false
      VERCEL_PROJECT_ID_DATAV_GUIDE:
        required: false
      VERCEL_PROJECT_ID_VBEN_COMPAT:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  configuration:
    name: Preflight all production configuration
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every platform before the first deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          VERCEL_PROJECT_ID_COCKPIT: ${{ secrets.VERCEL_PROJECT_ID_COCKPIT }}
          VERCEL_PROJECT_ID_DATAV_GUIDE: ${{ secrets.VERCEL_PROJECT_ID_DATAV_GUIDE }}
          VERCEL_PROJECT_ID_VBEN_COMPAT: ${{ secrets.VERCEL_PROJECT_ID_VBEN_COMPAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: node scripts/check-release-env.mjs production

  vercel:
    name: Deploy ${{ matrix.name }} to Vercel
    needs: configuration
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cockpit
            output: apps/lumal-cockpit/dist
            projectIdSecret: VERCEL_PROJECT_ID_COCKPIT
          - name: admin
            output: apps/lumal-admin/dist
            projectIdSecret: VERCEL_PROJECT_ID_ADMIN
          - name: datav-guide
            output: apps/lumal-datav-guide/dist
            projectIdSecret: VERCEL_PROJECT_ID_DATAV_GUIDE
          - name: vben-compat
            output: apps/vben-compat-demo/dist
            projectIdSecret: VERCEL_PROJECT_ID_VBEN_COMPAT
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: lumal-static-sites-${{ github.sha }}
          path: apps
      - name: Prepare Build Output API v3
        run: node scripts/prepare-vercel-output.mjs "${{ matrix.output }}" "output/deploy/${{ matrix.name }}"
      - name: Deploy prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.projectIdSecret] }}
        run: |
          pnpm dlx vercel@64.5.0 pull --yes --environment production --cwd "output/deploy/${{ matrix.name }}"
          pnpm dlx vercel@64.5.0 deploy --prebuilt --prod --yes --cwd "output/deploy/${{ matrix.name }}"

  cloudflare-pages:
    name: Deploy docs to Cloudflare Pages
    needs: configuration
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: lumal-static-sites-${{ github.sha }}
          path: apps
      - name: Deploy validated documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          test -f apps/lumal-docs/dist/index.html
          pnpm dlx wrangler@4.151.1 pages deploy apps/lumal-docs/dist \
            --project-name "$CF_PAGES_PROJECT" --branch main
