name: Release npm packages

# 仅供 release-gate.yml 的成功依赖调用，无 tag/手动旁路。
on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish validated packages
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 20
    env:
      NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check npm credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/check-release-env.mjs npm
      - run: pnpm install --frozen-lockfile
      - name: Download distributions tested in this run
        uses: actions/download-artifact@v4
        with:
          name: lumal-npm-dist-${{ github.sha }}
          path: packages
      - name: Reject existing or partially published versions
        run: pnpm release:verify --require-tag --check-registry
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @lumal/icons publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/icons-vue publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/core publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/charts publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/datav publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/cockpit publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/vben-compat publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter @lumal/vite publish --no-git-checks --tag "$NPM_DIST_TAG"
          pnpm --filter create-lumal-admin publish --no-git-checks --tag "$NPM_DIST_TAG"
