name: Temporary lint autofix

on:
  push:
    branches:
      - fix/lint-cleanup-20260731

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lint-cleanup-20260731

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply ESLint fixes
        run: pnpm exec eslint . --fix || true

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply eslint autofixes"
          git push origin HEAD:fix/lint-cleanup-20260731
