name: Build Validation

# 与 ci.yml 分工：ci.yml 负责 lint/test/typecheck/build，
# 这里只补它没覆盖的消费者脚手架校验；三个站点的构建移到 tag 触发的 release-gate.yml。
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Validate create-lumal-admin consumer
        run: pnpm test:create-consumer
