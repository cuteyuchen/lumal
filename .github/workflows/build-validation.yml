name: Build Validation

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply ESLint fixes
        if: github.event_name == 'pull_request'
        run: pnpm exec eslint . --fix || true

      - name: Commit ESLint fixes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply eslint autofixes"
          git push origin HEAD:${{ github.head_ref }}

      - name: Build packages
        run: pnpm build

      - name: Validate create-lumal-admin consumer
        run: pnpm test:create-consumer

      - name: Build documentation
        run: pnpm docs:build

      - name: Build Cockpit through package script
        run: pnpm --filter lumal-cockpit build

      - name: Build DataV guide through package script
        run: pnpm --filter lumal-datav-guide build
