name: CI

# 每次提交只跑轻量检查（lint / test / typecheck / build）。
# 完整发布门禁（E2E、打包验证、Windows 校验）移到 v* tag 触发的
# release-gate.yml 统一编排，发包/部署不能独立触发。
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  check:
    name: Lint / test / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Template formatting
        run: pnpm format:check

      - name: Release boundaries
        run: pnpm release:boundaries

      - name: Release workflow safety
        run: pnpm release:workflows

      - name: Validate Actions syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
