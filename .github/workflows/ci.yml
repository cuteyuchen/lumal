name: CI

# Ubuntu / Windows 独立执行代码检查；消费者与生产浏览器由 build-validation.yml 负责。
# 候选分支直接验证 HEAD，不依赖 PR 是否能生成临时合并提交；发包/部署仍只走 Release Gate。
on:
  push:
    branches:
      - master
      - codex/pure-vw-unification
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  check:
    name: Checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Template formatting
        run: pnpm format:check

      - name: Release boundaries
        run: pnpm release:boundaries

      - name: Release workflow safety
        run: pnpm release:workflows

      - name: Validate Actions syntax
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Test
        run: pnpm test

      - name: Upload platform terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-terminal-${{ matrix.os }}-${{ github.sha }}
          path: output/release/cli-terminal/
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
